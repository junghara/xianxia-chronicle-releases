name: Build Debug Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch, tag, or commit
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - ".release-trigger/debug/**"
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".release-trigger/debug/**"

permissions:
  contents: write

concurrency:
  group: xianxia-debug-apk-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REPOSITORY: junghara/xianxia-chronicle-AI-simulator
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}

    steps:
      - name: Verify private source token
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_TOKEN" ]] || { echo "SOURCE_REPO_TOKEN is required." >&2; exit 1; }

      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate public update notes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          notes_dir="release-notes/$version"
          summary="$notes_dir/SUMMARY.md"
          details="$notes_dir/DETAILS.md"
          [[ -s "$summary" ]] || {
            echo "Missing public summary: $summary" >&2
            exit 1
          }
          [[ -s "$details" ]] || {
            echo "Missing detailed update file: $details" >&2
            exit 1
          }
          grep -Eq '^#|^- |^[0-9]+\.' "$summary" || {
            echo "SUMMARY.md must contain a readable heading or update list." >&2
            exit 1
          }
          grep -Eq '^## ' "$details" || {
            echo "DETAILS.md must contain categorized detail sections." >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64 Debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PxianxiaAbi=arm64-v8a \
            --stacktrace \
            --console=plain \
            --no-daemon

      - name: Verify and package Debug APK
        id: package
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS='.' read -r major middle update <<< "$version"
          [[ "$middle" -le 9 && "$update" -le 9 ]]
          version_code=$((major * 1000000 + middle * 1000 + update))
          tag="v${version}-debug"
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          output_dir="debug-release-dist"
          apk_name="xianxia-chronicle-${version}-arm64-debug.apk"
          output_apk="$output_dir/$apk_name"
          summary_source="release-notes/$version/SUMMARY.md"
          details_source="release-notes/$version/DETAILS.md"
          summary_name="xianxia-chronicle-${version}-update-summary.md"
          details_name="xianxia-chronicle-${version}-detailed-changelog.md"
          summary_path="$output_dir/$summary_name"
          details_path="$output_dir/$details_name"

          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"
          cp "$summary_source" "$summary_path"
          cp "$details_source" "$details_path"

          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$output_apk"
          badging="$($tools/aapt dump badging "$output_apk")"
          grep -F "versionCode='$version_code'" <<< "$badging"
          grep -F "versionName='$version'" <<< "$badging"
          grep -F "native-code: 'arm64-v8a'" <<< "$badging"
          grep -F "application-debuggable" <<< "$badging"
          sha256sum "$output_apk" > "$output_apk.sha256"

          {
            echo "# 선협 역사 기록서 Alpha $version Debug"
            echo
            echo "> 기능 개발 중인 **알파 버전**이며, 오류 확인과 진단을 위한 디버깅 가능 빌드입니다."
            echo
            echo "## 업데이트 요약"
            echo
            cat "$summary_source"
            echo
            echo "## 상세 업데이트 내역"
            echo
            echo "가능한 전체 변경 내역은 릴리스에 첨부된 \`$details_name\` 파일에서 확인할 수 있습니다."
            echo
            echo "## 빌드 정보"
            echo
            echo "- 빌드 유형: Debug"
            echo "- 디버그 가능: 활성화"
            echo "- 정식 Release와 게임 기능·UI·JNI 경로: 동일"
            echo "- 지원 ABI: ARM64 (arm64-v8a)"
            echo "- 버전 코드: $version_code"
            echo "- 용도: 기능 확인과 오류 진단"
            echo
            echo "일반 설치 및 배포에는 같은 버전의 정식 서명 Release APK를 사용하세요."
          } > "$output_dir/RELEASE_NOTES.md"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=source/$output_apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=source/$output_apk.sha256" >> "$GITHUB_OUTPUT"
          echo "summary_path=source/$summary_path" >> "$GITHUB_OUTPUT"
          echo "details_path=source/$details_path" >> "$GITHUB_OUTPUT"
          echo "notes_path=source/$output_dir/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianxia-chronicle-${{ steps.package.outputs.version }}-debug
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.summary_path }}
            ${{ steps.package.outputs.details_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          SUMMARY_PATH: ${{ steps.package.outputs.summary_path }}
          DETAILS_PATH: ${{ steps.package.outputs.details_path }}
          NOTES_PATH: ${{ steps.package.outputs.notes_path }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "$APK_PATH#ARM64 Debug APK"
            "$CHECKSUM_PATH#SHA-256 checksum"
            "$SUMMARY_PATH#Update summary"
            "$DETAILS_PATH#Detailed changelog"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "Alpha $RELEASE_VERSION Debug" --notes-file "$NOTES_PATH" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target main --title "Alpha $RELEASE_VERSION Debug" --notes-file "$NOTES_PATH" --prerelease --repo "$GITHUB_REPOSITORY"
          fi

      - name: Record Debug release status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          status_path=".release-status/debug-latest.json"
          endpoint="repos/$GITHUB_REPOSITORY/contents/$status_path"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          status_file="$(mktemp)"
          cat > "$status_file" <<EOF
          {"status":"success","channel":"debug","version":"$RELEASE_VERSION","tag":"$RELEASE_TAG","apk":"$APK_NAME","source_ref":"$SOURCE_REF","workflow_run_id":"$GITHUB_RUN_ID","completed_at":"$completed_at","summary":"release body and attached file","details":"attached markdown file"}
          EOF
          encoded="$(base64 -w 0 "$status_file")"
          current_sha="$(gh api "$endpoint?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "$endpoint" -f message="Record Debug $RELEASE_VERSION release" -f content="$encoded" -f branch="main")
          [[ -z "$current_sha" ]] || args+=(-f sha="$current_sha")
          gh api "${args[@]}" >/dev/null
