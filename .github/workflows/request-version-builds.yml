name: Request and Verify Debug and Release APKs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".release-trigger/build-matrix/**"

permissions:
  actions: write
  contents: read

jobs:
  request-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read requested version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(find .release-trigger/build-matrix -maxdepth 1 -type f -name '*.txt' | sort | tail -n 1)"
          [[ -n "$request_file" && -f "$request_file" ]]
          version="$(sed -n 's/^version=//p' "$request_file" | tail -n 1 | tr -d '\r\n')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS='.' read -r major middle update <<< "$version"
          [[ "$middle" -le 9 && "$update" -le 9 ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch Debug and signed Release builds
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-and-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_ref=main
          gh workflow run build-official-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_ref=main
          echo "requested_at=$requested_at" >> "$GITHUB_OUTPUT"

      - name: Locate dispatched workflow runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            local run_id=""
            for attempt in $(seq 1 40); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq 'map(select(.createdAt >= env.REQUESTED_AT)) | sort_by(.createdAt) | last | .databaseId // empty')"
              [[ -z "$run_id" ]] || { printf '%s' "$run_id"; return 0; }
              sleep 5
            done
            return 1
          }
          debug_run="$(find_run build-and-release.yml)"
          release_run="$(find_run build-official-release.yml)"
          echo "debug_run=$debug_run" >> "$GITHUB_OUTPUT"
          echo "release_run=$release_run" >> "$GITHUB_OUTPUT"

      - name: Watch Debug build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.runs.outputs.debug_run }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Watch signed Release build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.runs.outputs.release_run }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify both public Alpha releases and update-note assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          debug_tag="v${VERSION}-debug"
          release_tag="v${VERSION}"
          summary="xianxia-chronicle-${VERSION}-update-summary.md"
          details="xianxia-chronicle-${VERSION}-detailed-changelog.md"

          verify_release() {
            local tag="$1"
            local apk_suffix="$2"
            local json
            json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,name,body,assets)"
            jq -e '.isPrerelease == true' <<< "$json" >/dev/null
            jq -e '.name | startswith("Alpha ")' <<< "$json" >/dev/null
            jq -e '.body | contains("업데이트 요약") and contains("상세 업데이트 내역")' <<< "$json" >/dev/null
            jq -e --arg suffix "$apk_suffix" '[.assets[].name] | any(endswith($suffix))' <<< "$json" >/dev/null
            jq -e --arg summary "$summary" '[.assets[].name] | index($summary) != null' <<< "$json" >/dev/null
            jq -e --arg details "$details" '[.assets[].name] | index($details) != null' <<< "$json" >/dev/null
          }

          verify_release "$debug_tag" "-debug.apk"
          verify_release "$release_tag" "-release.apk"
